<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>ChatGPT 사용량 모니터</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
  <div id="app" class="app-container">
    <!-- App Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="logo-svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">ChatGPT 사용량 모니터</h1>
          <div class="header-status">
            <span id="connection-indicator" class="status-indicator online" title="연결 상태: 정상"></span>
            <span id="last-updated-text" class="status-time">조회 대기 중...</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button id="pinBtn" class="btn-icon" title="창 고정 토글" aria-label="고정">
          <svg viewBox="0 0 24 24" class="icon-svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="17" x2="12" y2="22"/>
            <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17z"/>
          </svg>
        </button>
        <button id="themeBtn" class="btn-icon" title="다크/라이트 테마 전환" aria-label="테마 전환">
          <svg viewBox="0 0 24 24" class="icon-svg theme-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button id="refreshBtn" class="btn-icon" title="사용량 새로고침" aria-label="새로고침">
          <svg viewBox="0 0 24 24" class="icon-svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
        <button id="settingsBtn" class="btn-icon" title="환경설정" aria-label="설정">
          <svg viewBox="0 0 24 24" class="icon-svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button id="closeBtn" class="btn-icon" title="창 닫기" aria-label="닫기">
          <svg viewBox="0 0 24 24" class="icon-svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Scrollable Dynamic Cards Container -->
    <main id="cardsContainer" class="cards-container"></main>

    <!-- Add Slot Action Bar -->
    <div class="add-slot-container">
      <button id="addSlotBtn" class="btn-add-slot">+ 새 계정 추가</button>
    </div>

    <!-- Error/Notice Toast Banner -->
    <div id="toast-banner" class="toast-banner hidden" role="alert">
      <span id="toast-message" class="toast-message"></span>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-dialog">
        <div class="modal-header">
          <h2 id="settings-title" class="modal-title">환경설정</h2>
          <button id="btn-close-settings" class="btn-icon" aria-label="닫기">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="modal-body">
          <!-- Refresh Interval -->
          <div class="setting-item">
            <label class="setting-label" for="setting-poll-interval">
              <span class="setting-name">자동 갱신 주기</span>
              <span class="setting-desc">백그라운드에서 사용량을 조회하는 주기입니다.</span>
            </label>
            <select id="setting-poll-interval" class="setting-select">
              <option value="1">1분</option>
              <option value="3">3분</option>
              <option value="5" selected>5분 (권장)</option>
              <option value="10">10분</option>
              <option value="30">30분</option>
            </select>
          </div>

          <!-- Alert Threshold -->
          <div class="setting-item">
            <div class="setting-label">
              <span class="setting-name">알림 임계치 퍼센트</span>
              <span class="setting-desc">5시간 한도 잔여량이 설정값 이하일 때 경고 알림을 발송합니다.</span>
            </div>
            <div class="range-container">
              <input type="range" id="setting-alert-threshold" min="5" max="30" step="5" value="10" class="setting-range">
              <span id="setting-alert-threshold-val" class="range-val">10%</span>
            </div>
          </div>

          <!-- Toggle: Alert on Threshold -->
          <div class="setting-item toggle-item">
            <label class="setting-label" for="setting-notify-threshold">
              <span class="setting-name">임계치 경고 알림</span>
              <span class="setting-desc">잔여량 부족 시 Windows 토스트 알림을 받습니다.</span>
            </label>
            <label class="switch">
              <input type="checkbox" id="setting-notify-threshold" checked>
              <span class="slider"></span>
            </label>
          </div>

          <!-- Toggle: Alert on Reset -->
          <div class="setting-item toggle-item">
            <label class="setting-label" for="setting-notify-reset">
              <span class="setting-name">한도 리셋 완료 알림</span>
              <span class="setting-desc">5시간 한도가 100%로 초기화되었을 때 알림을 받습니다.</span>
            </label>
            <label class="switch">
              <input type="checkbox" id="setting-notify-reset" checked>
              <span class="slider"></span>
            </label>
          </div>

          <!-- Toggle: Start on Boot -->
          <div class="setting-item toggle-item">
            <label class="setting-label" for="setting-start-on-boot">
              <span class="setting-name">부팅 시 자동 시작</span>
              <span class="setting-desc">Windows 시작 시 트레이에 자동으로 상주합니다.</span>
            </label>
            <label class="switch">
              <input type="checkbox" id="setting-start-on-boot">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="modal-footer">
          <button id="btn-cancel-settings" class="btn btn-secondary">취소</button>
          <button id="btn-save-settings" class="btn btn-primary">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
